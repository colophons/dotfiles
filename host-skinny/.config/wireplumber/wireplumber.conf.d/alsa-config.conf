# skinny: keep unavailable HDMI/DP outputs out of normal audio routing.
monitor.alsa.rules = [
  {
    matches = [
      { node.nick = "HDMI 1" },
      { node.nick = "HDMI 2" },
      { node.nick = "HDMI 3" },
      { node.nick = "HDMI / DisplayPort 1 Output" },
      { node.nick = "HDMI / DisplayPort 2 Output" },
      { node.nick = "HDMI / DisplayPort 3 Output" },
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
